name: ci

on:
  push:
  pull_request:

# One job per package and lane. Each package runs its own gates from its folder;
# uv installs into the workspace's shared environment from the one uv.lock.
jobs:
  linux:
    # Core + dev only: no mlx (Apple Silicon), no PaperQA2 / Docling extras.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [docingest, docingest-index, quantum-sim, research-api, qa-bench]
        include:
          - package: quantum-sim
            lint_paths: src tests tools
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen ruff check ${{ matrix.lint_paths || 'src tests' }}
      - run: uv run --frozen ruff format --check ${{ matrix.lint_paths || 'src tests' }}
      - run: uv run --frozen lint-imports
      - run: uv run --frozen pytest -q --cov

  macos:
    # Everything installed; model / network tests stay opt-in.
    runs-on: macos-latest
    strategy:
      matrix:
        package: [docingest, docingest-index, quantum-sim, research-api, qa-bench]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest -q --cov

  shell:
    # The shared-server script passes shellcheck. The version is pinned so that a new runner
    # image cannot add checks and turn the job red; raise it on purpose. scripts/check.sh runs
    # the same command and skips it where shellcheck is missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx --from shellcheck-py==0.11.0.1 shellcheck --version
      - run: uvx --from shellcheck-py==0.11.0.1 shellcheck deploy/research-api.sh

  web:
    # The web app: lint, format, types, unit tests, build, bundle budget, dependency audit.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/web/package.json
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - run: pnpm build
      - run: pnpm size
      - run: pnpm audit --prod --audit-level high

  contract:
    # The API and the web app agree: the committed OpenAPI document and generated types match
    # the API, and a browser test runs the built app against the API in fake mode.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/web/package.json
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
      - run: uv sync --locked
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
